name: Build

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish GUI
        run: dotnet publish SteamAutoCrack/SteamAutoCrack.csproj -c Release -r win-x86 --self-contained false -p:Platform=x86 -o out/gui

      - name: Publish CLI
        run: dotnet publish SteamAutoCrack.CLI/SteamAutoCrack.CLI.csproj -c Release -r win-x86 --self-contained false -p:Platform=x86 -o out/cli

      - uses: actions/upload-artifact@v4
        with:
          name: SteamAutoCrack-GUI
          path: out/gui

      - uses: actions/upload-artifact@v4
        with:
          name: SteamAutoCrack-CLI
          path: out/cli
